name: Bug report / مشكلة
description: Report an installation, profile, or runtime problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, passwords, or private project data. لا تنشر بيانات حساسة."
  - type: input
    id: pack
    attributes:
      label: Pack version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Harness name/version and operating system
      placeholder: Include the exact versions when available.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does the problem occur?
      options:
        - Installation or restoration
        - Agent discovery or activation
        - Task execution or permissions
        - Documentation or other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command used and relevant paths with personal details removed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove credentials and private information before sharing.
